# SPDX-License-Identifier: GPL-3.0-or-later
name: Normalize login compatibility contract

on:
  push:
    paths:
      - '.github/workflows/normalize-login-user-id.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize login contract
        run: python tools/normalize_login_user_id_once.py
      - name: Validate public repository
        run: python tools/validate_public_repo.py
      - name: Commit normalized specification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification/methods.json
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize administrator login compatibility contract'
          git push
