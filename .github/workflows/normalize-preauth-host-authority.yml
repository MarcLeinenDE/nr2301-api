# SPDX-License-Identifier: GPL-3.0-or-later
name: Normalize preauth host authority

on:
  push:
    paths:
      - '.github/workflows/normalize-preauth-host-authority.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize preauth host-authority evidence
        run: python tools/normalize_preauth_host_authority_once.py
      - name: Validate public repository
        run: python tools/validate_public_repo.py
      - name: Commit normalized specification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification/methods.json
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize administrator preauth host authority'
          git push
