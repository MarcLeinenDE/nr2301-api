# SPDX-License-Identifier: GPL-3.0-or-later
name: Record WPS response shapes

on:
  push:
    paths:
      - '.github/workflows/record-wps-response-shapes.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/record_wps_response_shapes_once.py
      - run: python tools/validate_public_repo.py
      - name: Commit WPS response-shape evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification/methods.json specification/semantics.json api/wireless.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record live WPS action response envelopes'
          git push
