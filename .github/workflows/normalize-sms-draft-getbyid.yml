# SPDX-License-Identifier: GPL-3.0-or-later
name: Normalize SMS draft and get-by-id

on:
  push:
    paths:
      - '.github/workflows/normalize-sms-draft-getbyid.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/normalize_sms_draft_getbyid_once.py
      - run: python tools/validate_public_repo.py
      - name: Commit normalized SMS contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification/methods.json api/sms.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize SMS draft and get-by-id contracts'
          git push
