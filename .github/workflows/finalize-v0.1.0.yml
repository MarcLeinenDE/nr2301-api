name: Finalize v0.1.0 metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize methods specification release field
        shell: python
        run: |
          from pathlib import Path
          p = Path('specification/methods.json')
          s = p.read_text(encoding='utf-8')
          old = '"release": "0.1-rc3"'
          new = '"release": "0.1.0"'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one {old!r}, got {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit exact metadata-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specification/methods.json
          git diff --cached --exit-code && exit 0
          git commit -m "Finalize v0.1.0 methods specification metadata"
          git push
