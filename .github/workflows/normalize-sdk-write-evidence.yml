# SPDX-License-Identifier: GPL-3.0-or-later
name: Normalize SDK write evidence

on:
  push:
    paths:
      - '.github/workflows/normalize-sdk-write-evidence.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize physical SDK write evidence
        run: python tools/normalize_sdk_write_evidence_once.py
      - name: Validate public repository
        run: python tools/validate_public_repo.py
      - name: Commit normalized evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification/methods.json api/cm.md api/wireless.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize physical SDK write evidence'
          git push
