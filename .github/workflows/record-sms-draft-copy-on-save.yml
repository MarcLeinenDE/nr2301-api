# SPDX-License-Identifier: GPL-3.0-or-later
name: Record SMS Draft COPY_ON_SAVE evidence

on:
  push:
    paths:
      - '.github/workflows/record-sms-draft-copy-on-save.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/record_sms_draft_copy_on_save_once.py
      - run: python tools/validate_public_repo.py
      - name: Commit COPY_ON_SAVE evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification/methods.json api/sms.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record SMS Draft COPY_ON_SAVE semantics'
          git push
