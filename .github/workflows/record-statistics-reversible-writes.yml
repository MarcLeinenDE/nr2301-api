# SPDX-License-Identifier: GPL-3.0-or-later
name: Record reversible statistics writes

on:
  push:
    paths:
      - '.github/workflows/record-statistics-reversible-writes.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/record_statistics_reversible_writes_once.py
      - run: python tools/validate_public_repo.py
      - name: Commit physical evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification/methods.json api/statistics.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record reversible statistics write evidence'
          git push
