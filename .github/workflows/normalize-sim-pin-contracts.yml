# SPDX-License-Identifier: GPL-3.0-or-later
name: Normalize SIM PIN request contracts

on:
  push:
    paths:
      - '.github/workflows/normalize-sim-pin-contracts.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/normalize_sim_pin_contracts_once.py
      - run: python tools/validate_public_repo.py
      - name: Commit normalized SIM contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification/methods.json api/sim.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize SIM PIN and PUK request contracts'
          git push
