# SPDX-License-Identifier: GPL-3.0-or-later
name: Normalize verified app contracts

on:
  push:
    paths:
      - '.github/workflows/normalize-app-contracts.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize public API contracts
        run: python tools/normalize_app_contracts_once.py
      - name: Validate
        run: python tools/validate_public_repo.py
      - name: Commit normalized contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specification/methods.json specification/semantics.json api/sms.md api/wireless.md
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize verified Wi-Fi and SMS contracts'
          git push
